# Gateway API (needs a Gateway API controller + CRDs installed)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: myapp
spec:
  gatewayClassName: CHANGE_ME_GATEWAY_CLASS     # kubectl get gatewayclass
  # addresses:                                  # optional fixed IP (if the implementation supports it)
  #   - type: IPAddress
  #     value: 10.0.0.50
  listeners:
    - name: http
      protocol: HTTP
      port: 80                                  # listener port
      # hostname: app.example.com               # optional
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: myapp
spec:
  parentRefs:
    - {name: web-gateway}
  # hostnames: ["app.example.com"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: web, port: 80}
