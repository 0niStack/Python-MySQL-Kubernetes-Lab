apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: myapp
spec:
  type: NodePort
  externalTrafficPolicy: Cluster   # Local keeps the client IP (only nodes running a web pod answer)
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: 8000, nodePort: 30080}   # http://<node-ip>:30080
