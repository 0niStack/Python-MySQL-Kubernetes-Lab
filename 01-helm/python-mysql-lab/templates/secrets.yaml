{{- if .Values.secrets.create }}
{{- /*
  Random passwords are generated once and re-used on every upgrade (lookup),
  so the MySQL data volume never ends up with a password the secret no longer has.
  NOTE: `helm template` / --dry-run cannot lookup, it shows throw-away values.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Values.namespaces.db "mysql-credentials" -}}
{{- $rootPw := .Values.secrets.rootPassword -}}
{{- $appPw := .Values.secrets.appPassword -}}
{{- if and $existing $existing.data -}}
  {{- if not $rootPw }}{{ $rootPw = index $existing.data "MYSQL_ROOT_PASSWORD" | b64dec }}{{ end -}}
  {{- if not $appPw }}{{ $appPw = index $existing.data "MYSQL_PASSWORD" | b64dec }}{{ end -}}
{{- end -}}
{{- if not $rootPw }}{{ $rootPw = randAlphaNum 24 }}{{ end -}}
{{- if not $appPw }}{{ $appPw = randAlphaNum 24 }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: {{ .Values.namespaces.db }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ $rootPw | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  MYSQL_USER: {{ .Values.mysql.user | quote }}
  MYSQL_PASSWORD: {{ $appPw | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: app-db-credentials
  namespace: {{ .Values.namespaces.app }}
type: Opaque
stringData:
  DB_USER: {{ .Values.mysql.user | quote }}
  DB_PASSWORD: {{ $appPw | quote }}
{{- end }}
