{{- $sc := include "pml.storageClassName" . }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: mysql, namespace: {{ .Values.namespaces.db }}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: mysql, namespace: {{ .Values.namespaces.db }}}
spec:
  type: ClusterIP          # never NodePort/LoadBalancer for the database
  selector: {app: mysql}
  ports:
    - {name: mysql, port: 3306, targetPort: 3306}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: {{ .Values.namespaces.db }}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      serviceAccountName: mysql
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          # datadir in a sub-folder: ext4 volumes (Longhorn) contain lost+found,
          # and MySQL refuses to initialise a data dir that is not empty.
          args: ["--skip-name-resolve", "--datadir=/var/lib/mysql/data"]
          ports:
            - {name: mysql, containerPort: 3306}
          envFrom:
            - secretRef: {name: mysql-credentials}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources: {{- toYaml .Values.mysql.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 45
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [{{ .Values.storage.accessMode | quote }}]
        {{- if $sc }}
        storageClassName: {{ $sc | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.storage.size }}}
